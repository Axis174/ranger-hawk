name: Refresh hunt data

on:
  schedule:
    # 11:15 UTC daily = 5:15 a.m. MDT / 4:15 a.m. MST
    - cron: '15 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - 'docs/**'
      - '.github/workflows/refresh.yml'
    # The bot's own data commits use GITHUB_TOKEN, and GitHub does not trigger
    # workflows from those, so watching docs/** cannot loop.

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh upstream data
        run: python scraper/refresh.py
        env:
          # Empty until the secret is set; refresh.py skips the UDOT block and
          # writes a placeholder rather than failing the run.
          UDOT_API_KEY: ${{ secrets.UDOT_API_KEY }}

      - name: Rebuild access contacts
        run: python scraper/build_access_contacts.py
        continue-on-error: true

      - name: Rebuild calendar feed
        run: python scraper/build_calendar.py

      - name: Summarise the run
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('docs/data/changelog.json')
          if not p.exists():
              print('no changelog'); raise SystemExit
          run = json.loads(p.read_text())['runs'][0]
          out = []
          out.append(f"### Hunt data refresh — {run['run']}\n")
          if run['changes']:
              out.append(f"**{len(run['changes'])} source(s) changed**\n")
              for c in run['changes']:
                  out.append(f"- **{c['source']}** — {c.get('desc','')}")
                  for d in (c.get('detail') or [])[:8]:
                      if d['type'] == 'changed':
                          out.append(f"  - `{d['item']}` · {d['field']}: “{d['from']}” → “{d['to']}”")
                      else:
                          out.append(f"  - {d['type']}: `{d['item']}`")
          else:
              out.append('No upstream changes.\n')
          if run['errors']:
              out.append(f"\n**{len(run['errors'])} source(s) failed**\n")
              for e in run['errors']:
                  out.append(f"- `{e['source']}` — {e['error'][:160]}")
          txt = "\n".join(out)
          print(txt)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(txt + "\n")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The five suites run against the data just written, BEFORE it is committed.
      # Any red suite fails the step and the job stops here: nothing is committed
      # or deployed. (No continue-on-error, no if: always() on these or on the
      # commit step.)
      - name: Test the refreshed data
        run: |
          node scraper/test_go.js
          node scraper/test_site.js
          node scraper/test_contacts.js
          node scraper/fishing/test_fishing.js
          python3 -m unittest scraper.test_access_contacts

      - name: Commit refreshed data
        run: |
          git config user.name  "hunt-atlas-bot"
          git config user.email "hunt-atlas-bot@users.noreply.github.com"
          git add -A docs/
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          # Another run (or a hand edit) can land between our checkout and our
          # push. Rebase onto whatever arrived and retry rather than failing the
          # whole refresh over a race.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash origin main || true
            sleep $(( i * 5 ))
          done
          echo "::warning::could not push refreshed data after 5 attempts; \
          the Pages deploy below still publishes this run's output"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
