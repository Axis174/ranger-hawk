name: Refresh hunt data

on:
  schedule:
    # Set for 11:15 UTC (5:15 a.m. MDT / 4:15 a.m. MST), but GitHub starts its
    # scheduled runs late: every one of the 66 from 2026-09-21 to 2026-11-25
    # began between 2 hours 56 minutes and 11 hours 21 minutes after this time,
    # and GitHub's documentation gives no limit (the schedule event "can be delayed during periods of high
    # loads", and queued jobs "may be dropped"). So this line is the midday
    # refresh and the fallback, not the before-dawn one. A run that is asked
    # for is not held up that way (a push has its run a second or two later),
    # so the before-dawn run is asked for from outside GitHub, through
    # workflow_dispatch below, at 4:10 a.m. Mountain: see ops/dawn-trigger.
    # That is live only once Pete has set it up and the repo variable
    # DAWN_TRIGGER is on; until then this late run is the only one each day.
    - cron: '15 11 * * *'
  workflow_dispatch:
    inputs:
      alarm_test:
        description: 'Prove the red-run alarm: run as usual, then open the alarm issue anyway'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - 'docs/**'
      - '.github/workflows/refresh.yml'
    # The bot's own data commits use GITHUB_TOKEN, and GitHub does not trigger
    # workflows from those, so watching docs/** cannot loop.

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh upstream data
        run: python scraper/refresh.py
        env:
          # Empty until the secret is set; refresh.py skips the UDOT block and
          # writes a placeholder rather than failing the run.
          UDOT_API_KEY: ${{ secrets.UDOT_API_KEY }}

      - name: Rebuild access contacts
        run: python scraper/build_access_contacts.py
        continue-on-error: true

      - name: Rebuild calendar feed
        run: python scraper/build_calendar.py

      - name: Summarise the run
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('docs/data/ut/changelog.json')
          if not p.exists():
              print('no changelog'); raise SystemExit
          run = json.loads(p.read_text())['runs'][0]
          out = []
          out.append(f"### Hunt data refresh — {run['run']}\n")
          if run['changes']:
              out.append(f"**{len(run['changes'])} source(s) changed**\n")
              for c in run['changes']:
                  out.append(f"- **{c['source']}** — {c.get('desc','')}")
                  for d in (c.get('detail') or [])[:8]:
                      if d['type'] == 'changed':
                          out.append(f"  - `{d['item']}` · {d['field']}: “{d['from']}” → “{d['to']}”")
                      else:
                          out.append(f"  - {d['type']}: `{d['item']}`")
          else:
              out.append('No upstream changes.\n')
          if run['errors']:
              out.append(f"\n**{len(run['errors'])} source(s) failed**\n")
              for e in run['errors']:
                  out.append(f"- `{e['source']}` — {e['error'][:160]}")
          # An unread fishing notice does not stop the job: the app shows the old rule,
          # marked as not built in. It is flagged here and in refresh.py's log lines.
          unread = run.get('unread_notices') or []
          if unread:
              out.append(f"\n**{len(unread)} fishing notice(s) not yet read into the rules**\n")
              for u in unread:
                  out.append(f"- NOTICE UNREAD: {u['title']} {u['first_seen']} {u['url']}")
                  print(f"::warning title=Fishing notice unread::{u['title']} {u['first_seen']} {u['url']}")
          txt = "\n".join(out)
          print(txt)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(txt + "\n")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Writes the static pages, sitemap, llms.txt and the home page's head tags from
      # scraper/pages/content.js and the data just refreshed. A count that is not a
      # whole number above zero, or a leftover {placeholder}, fails the job here.
      - name: Build static pages
        run: node scraper/build_pages.js

      # The eight suites run against the data just written, BEFORE it is committed.
      # Any red suite fails the step and the job stops here: nothing is committed
      # or deployed. (No continue-on-error, no if: always() on these or on the
      # commit step.)
      # An unread fishing notice is not a red suite: it is listed in the run's
      # changelog entry and printed as NOTICE UNREAD, and the rest of the data goes on
      # refreshing. test_fishing.js fails only if such a notice is missing from that list.
      - name: Test the refreshed data
        run: |
          node scraper/test_go.js
          node scraper/test_site.js
          node scraper/test_contacts.js
          node scraper/fishing/test_fishing.js
          node scraper/test_pages.js
          node scraper/test_forecast.js
          node scraper/test_units.js
          python3 -m unittest scraper.test_access_contacts

      - name: Commit refreshed data
        run: |
          git config user.name  "hunt-atlas-bot"
          git config user.email "hunt-atlas-bot@users.noreply.github.com"
          git add -A docs/
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          # Another run (or a hand edit) can land between our checkout and our
          # push. Rebase onto whatever arrived and retry rather than failing the
          # whole refresh over a race.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push rejected, rebasing (attempt $i)"
            if ! git pull --rebase --autostash origin main; then
              # A rebase that stops on a conflict leaves merge markers in the
              # data files (run of 2026-11-23). Undo it, so the tree goes back to
              # this run's own commit and nothing half-merged is published.
              git rebase --abort || true
            fi
            sleep $(( i * 5 ))
          done
          echo "::warning::could not push refreshed data after 5 attempts; \
          the Pages deploy below still publishes this run's output"

      # The commit step above must never hand a half-merged tree to the deploy. On
      # 2026-11-23 its rebase stopped on a conflict and left merge markers in five
      # data files; only a failed deploy kept them off the live site. This step
      # fails the job before anything is uploaded if that state is ever seen again.
      - name: Refuse to publish a half-merged tree
        run: |
          if [ -n "$(git ls-files -u)" ] \
             || [ -d "$(git rev-parse --git-path rebase-merge)" ] \
             || [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
            echo "::error title=Half-merged tree::the data commit stopped in the middle of a rebase; nothing is published from this run"
            git status --short | head -40
            exit 1
          fi
          echo "tree is whole"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # deploy-pages asks GitHub once for this run's artifact and gives up if the
      # list comes back empty. On 2026-11-19, 11-22 and 11-23 it came back empty
      # under a second after the upload above reported success ("Found 0
      # artifact(s)"), so the data was committed and the site was not updated.
      # Up to three attempts, with a wait between them. An attempt runs only when
      # the one before it failed, the artifact is uploaded once, and the job is
      # red only if the third attempt fails too. A failed test suite still stops
      # the job long before this: none of these steps runs after a failure.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before the second deploy attempt
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning title=Deploy retried::first deploy attempt failed; trying again in 20 seconds"
          sleep 20
      - id: deployment_2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before the third deploy attempt
        if: steps.deployment_2.outcome == 'failure'
        run: |
          echo "::warning title=Deploy retried::second deploy attempt failed; trying again in 60 seconds"
          sleep 60
      - id: deployment_3
        if: steps.deployment_2.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # A red run must not go unseen (five scheduled runs failed between 2026-11-05
  # and 2026-11-23). This job changes nothing in the refresh job above: it runs
  # after it, has its own token rights (issues, and reading the run list; the
  # refresh job gets neither; it cannot write to the repo or to Pages) and never
  # touches the tree. It opens an issue in this repo labelled refresh-red and
  # assigned to the repo owner, or adds a line to the one already open, when:
  #   - the refresh job did not end green, whatever started the run (a failed
  #     suite, a failed deploy). A run that a person cancelled, or that a newer
  #     run replaced in the queue, is not reported. A job cut off by GitHub (a
  #     time limit, a lost runner) should be reported too, but GitHub's
  #     documentation does not say and it has not been seen;
  #   - GitHub's own scheduled run finds that no run was asked for in the 20
  #     hours before it (only once the repo variable DAWN_TRIGGER is on). The
  #     trigger asks at 10:10 or 11:10 UTC and the scheduled run has started
  #     between 14:10 and 22:36 UTC, so 20 hours takes in today's and leaves out
  #     yesterday's. Two limits: any run asked for counts, so a Run workflow
  #     click that day hides a dead trigger for that day; and a scheduled run
  #     more than about 19 hours late would report a trigger that did fire;
  #   - someone ticks alarm_test on Run workflow, to see the alarm work.
  # The issue is closed by hand, so an open refresh-red issue means a red day
  # nobody has dealt with yet.
  alarm:
    needs: refresh
    if: ${{ !cancelled() && (needs.refresh.result != 'success' || inputs.alarm_test || (github.event_name == 'schedule' && vars.DAWN_TRIGGER == 'on')) }}
    runs-on: ubuntu-latest
    # contents: read is what GitHub's own example for gh issue create carries.
    # The repo is public, so it adds nothing a stranger does not have.
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Open or update the refresh-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          RESULT: ${{ needs.refresh.result }}
          ALARM_TEST: ${{ inputs.alarm_test }}
          DAWN_TRIGGER: ${{ vars.DAWN_TRIGGER }}
        run: |
          day=$(date -u +%Y-%m-%d)
          title=""
          lines=""
          add() {
            [ -n "$title" ] || title="$1"
            if [ -n "$lines" ]; then lines="$lines"$'\n\n'"$2"; else lines="$2"; fi
          }

          if [ "$RESULT" != "success" ]; then
            # The failed step's name, read from this run's own job list. If the
            # list cannot be read the issue is still opened, without the name.
            # (When a call fails, gh prints GitHub's error text where the answer
            # would be, so a failed call's output is thrown away, here and below.)
            step=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
              --jq '[.jobs[] | select(.name == "refresh") | .steps[]? | select(.conclusion == "failure" or .conclusion == "cancelled") | .name] | join("; ")' \
              2>/dev/null) || step=""
            [ -n "$step" ] || step="not listed, open the run"
            add "Refresh run failed $day" \
              "$day (UTC): the run started by $EVENT ended as $RESULT at: $step. $RUN_URL"
          fi

          if [ "$EVENT" = "schedule" ] && [ "$DAWN_TRIGGER" = "on" ]; then
            since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            asked=$(gh api -X GET "repos/$GH_REPO/actions/workflows/refresh.yml/runs" \
              -f event=workflow_dispatch -f "created=>=$since" -f per_page=1 \
              --jq '.total_count' 2>/dev/null) || asked=unknown
            # Anything that is not a plain count is treated as not read.
            case "$asked" in ''|*[!0-9]*) asked=unknown ;; esac
            echo "runs asked for since $since: $asked"
            if [ "$asked" = "0" ]; then
              add "Dawn trigger silent $day" \
                "$day (UTC): no run was asked for in the last 20 hours, so the dawn trigger did not fire and GitHub's own late run was the only refresh. ops/dawn-trigger/README.md says where to look; a lapsed token is the usual cause. $RUN_URL"
            elif [ "$asked" = "unknown" ]; then
              echo "::warning title=Dawn trigger not checked::the list of runs could not be read"
            fi
          fi

          if [ "$ALARM_TEST" = "true" ]; then
            add "Alarm test $day" \
              "$day (UTC): ALARM TEST, asked for by hand. Nothing is wrong. $RUN_URL"
          fi

          if [ -z "$lines" ]; then
            echo "nothing to report"
            exit 0
          fi
          echo "$lines"

          gh label create refresh-red --color B60205 \
            --description "A refresh run did not finish green" 2>/dev/null || true

          open=$(gh issue list --label refresh-red --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$lines"
            exit 0
          fi

          body="$lines

          If a refresh run stopped before \"Commit refreshed data\", nothing was committed or published and the site still shows the last good run. If it stopped at a deploy step, the data was committed and the site was not updated: start a new run with Run workflow, not Re-run.

          Later red days are added below as comments. This issue is closed by hand, once someone has read it."
          gh issue create --title "$title" --label refresh-red \
            --assignee "$OWNER" --body "$body" \
          || gh issue create --title "$title" --label refresh-red --body "$body"
